[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "trendsky-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.162,<0.163", "uvicorn>=0.41,<1", "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3", "sqlalchemy>=2.1,<2.2", "alembic>=1.17,<2",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.19,<2", "pip-audit>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["trendsky_api"]
mypy_path = "apps/api"
